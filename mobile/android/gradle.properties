# Memoria de Gradle.
#
# La plantilla de Flutter trae `-Xmx8G -XX:MaxMetaspaceSize=4G`, que en una
# maquina de 8 GB le pide a la JVM mas memoria de la que hay fisicamente: el
# sistema empieza a paginar y el compilador de Kotlin muere a mitad de camino
# dejando corrupta su cache incremental. Los valores de abajo estan calculados
# para 8 GB; en una maquina con mas RAM se pueden subir.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

# El compilador de Kotlin corre en su propio demonio, con su propio heap. Sin
# este limite hereda el de arriba y se suman dos JVM grandes a la vez.
kotlin.daemon.jvmargs=-Xmx1280m

# Sin paralelismo entre modulos: `camera` y `google_mlkit_pose_detection` son
# los dos modulos mas pesados del proyecto y compilarlos a la vez es lo que
# agota la memoria. Cuesta algo de tiempo y evita que el build falle.
org.gradle.parallel=false

android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# AGP 9.1 recomienda como maximo compileSdk 36, pero flutter_secure_storage
# exige 37. Compila bien; se silencia el aviso.
android.suppressUnsupportedCompileSdk=37

# Recortar la memoria (arriba) era necesario pero no suficiente: con esos
# limites puestos, el build sigue fallando con "Could not close incremental
# caches" en un plugin distinto cada vez. Windows no libera los archivos
# que el compilador de Kotlin mapea en memoria. Sin cache incremental
# compila entero cada vez: mas lento, pero termina.
kotlin.incremental=false
