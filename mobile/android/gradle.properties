org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# AGP 9.1 recomienda como maximo compileSdk 36, pero
# flutter_secure_storage exige 37. Compila bien; se silencia el aviso.
android.suppressUnsupportedCompileSdk=37

# Windows no libera los archivos mapeados en memoria de la cache
# incremental de Kotlin y el build falla con "Could not close
# incremental caches" en un plugin distinto cada vez (camera,
# google_mlkit_commons, shared_preferences...). Sin cache incremental
# compila entero cada vez: mas lento, pero determinista.
kotlin.incremental=false
