name: violetboutique
description: >
  Violet Boutique - aplicacion movil de la plataforma inteligente de comercio
  electronico para tienda de ropa, con vestidor virtual via realidad aumentada.
publish_to: "none"
version: 1.0.0+2

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations: # textos de Material en castellano
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- Comunicacion con la API ------------------------------------------
  dio: ^5.11.0 # cliente HTTP con interceptor de token
  cached_network_image: ^4.0.0 # imagenes del catalogo con cache

  # --- Estado y navegacion ----------------------------------------------
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.0

  # --- Almacenamiento local ---------------------------------------------
  flutter_secure_storage: ^11.0.0 # token JWT
  shared_preferences: ^2.5.5 # preferencias del usuario
  path_provider: ^2.1.6

  # --- Vestidor virtual (P9, ciclo 3) -----------------------------------
  camera: ^0.12.0+2 # vista de camara en vivo
  google_mlkit_pose_detection: ^0.16.1 # deteccion de pose en el dispositivo
  image: ^4.9.2 # composicion de la captura
  permission_handler: ^13.0.1 # permiso de camara y de microfono
  # CU-35: el reconocimiento de voz corre EN EL TELEFONO, con el motor del
  # sistema. Es gratis, no consume cuota del modelo y no sube audio a ningun
  # lado: al servidor le llega el texto ya transcrito.
  speech_to_text: ^7.0.0

  # --- Compra (P7 y P8, ciclo 3) ----------------------------------------
  # Abre la pasarela de pago en el navegador del telefono. NO se usa un
  # WebView adentro de la app a proposito: la pagina de pago es de un tercero
  # y meterla en un WebView propio es exactamente lo que los navegadores
  # ensenan a desconfiar --- el cliente no puede ver la barra de direcciones
  # ni el candado, que es como comprueba que le esta dando la tarjeta a quien
  # cree. Ademas Stripe lo desaconseja.
  url_launcher: ^6.3.1

  # CU-35 y CU-37. Lo que se baja se guarda en el directorio PRIVADO de la
  # aplicacion, que el explorador de archivos del telefono no muestra: el
  # reporte quedaba bajado y el usuario no lo encontraba. Con la hoja de
  # compartir del sistema se manda a Drive, a WhatsApp o a «Archivos», que es
  # donde la persona lo va a buscar.
  share_plus: ^13.3.0

  # --- Utilidades --------------------------------------------------------
  intl: ^0.20.3 # formato de fechas y moneda

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/imagenes/
