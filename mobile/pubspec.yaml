name: fashionstore
description: >
  FashionStore - aplicacion movil de la plataforma inteligente de comercio
  electronico para tienda de ropa, con vestidor virtual via realidad aumentada.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # --- Comunicacion con la API ------------------------------------------
  dio: ^5.11.0 # cliente HTTP con interceptor de token
  cached_network_image: ^4.0.0 # imagenes del catalogo con cache

  # --- Estado y navegacion ----------------------------------------------
  flutter_riverpod: ^3.4.2
  go_router: ^18.0.0

  # --- Almacenamiento local ---------------------------------------------
  flutter_secure_storage: ^11.0.0 # token JWT
  shared_preferences: ^2.5.5 # preferencias del usuario
  path_provider: ^2.1.6

  # --- Vestidor virtual (P9, ciclo 3) -----------------------------------
  camera: ^0.12.0+2 # vista de camara en vivo
  google_mlkit_pose_detection: ^0.16.1 # deteccion de pose en el dispositivo
  image: ^4.9.2 # composicion de la captura
  permission_handler: ^13.0.1 # permiso de camara

  # --- Utilidades --------------------------------------------------------
  intl: ^0.20.3 # formato de fechas y moneda

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/imagenes/
