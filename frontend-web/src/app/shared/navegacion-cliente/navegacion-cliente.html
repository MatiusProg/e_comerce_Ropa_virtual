@if (visible()) {
  <nav class="navegacion" aria-label="Secciones del cliente">
    <div class="enlaces">
    <a routerLink="/tienda" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">
      <mat-icon>storefront</mat-icon>
      Catálogo
    </a>
    <a routerLink="/tienda/carrito" routerLinkActive="activo">
      <mat-icon
        [matBadge]="itemsEnCarrito() || null"
        matBadgeColor="accent"
        matBadgeSize="small"
        >shopping_bag</mat-icon
      >
      Mi carrito
    </a>
    <a routerLink="/tienda/para-vos" routerLinkActive="activo">
      <mat-icon>auto_awesome</mat-icon>
      Para vos
    </a>
    <!-- CU-34. Junto a «Para vos»: las dos son la misma idea desde dos
         lados — una sugiere sin que se le pida y la otra contesta lo que se
         le pregunta. -->
    <a routerLink="/tienda/asistente" routerLinkActive="activo">
      <mat-icon>chat_bubble_outline</mat-icon>
      Asistente
    </a>
    <a routerLink="/tienda/favoritos" routerLinkActive="activo">
      <mat-icon>favorite</mat-icon>
      Mis favoritos
    </a>
    <a routerLink="/mi-cuenta/compras" routerLinkActive="activo">
      <mat-icon>receipt_long</mat-icon>
      Mis compras
    </a>
    <a routerLink="/mi-cuenta/reservas" routerLinkActive="activo">
      <mat-icon>event_available</mat-icon>
      Mis reservas
    </a>
    <a routerLink="/mi-cuenta" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">
      <mat-icon>person</mat-icon>
      Mi perfil
    </a>

    </div>

    <!-- Salir va al final y separado: no es una sección más, y ponerlo entre
         las pestañas lo vuelve fácil de tocar por error. -->
    <button
      matIconButton
      type="button"
      class="salir"
      matTooltip="Cerrar sesión"
      aria-label="Cerrar sesión"
      (click)="salir()"
    >
      <mat-icon>logout</mat-icon>
    </button>
  </nav>
}
