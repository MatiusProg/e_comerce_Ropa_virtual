<mat-toolbar class="barra">
  <span class="logotipo vb-titulo">Violet Boutique</span>
  <span class="etiqueta-area">Caja</span>

  <span class="separador"></span>

  @if (usuario(); as u) {
    <span class="identidad">
      <span class="avatar">{{ iniciales() }}</span>
      <span class="datos">
        <span class="nombre">{{ u.nombres }} {{ u.apellidos }}</span>
        <span class="rol">Cajero</span>
      </span>
    </span>
    <button matIconButton type="button" (click)="salir()" aria-label="Cerrar sesión">
      <mat-icon>logout</mat-icon>
    </button>
  }
</mat-toolbar>

<nav class="navegacion" aria-label="Secciones de caja">
  <a routerLink="/caja" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }">
    <mat-icon>point_of_sale</mat-icon>
    Mi turno
  </a>
  <a routerLink="/caja/vender" routerLinkActive="activo">
    <mat-icon>shopping_cart_checkout</mat-icon>
    Vender
  </a>
  <a routerLink="/caja/devoluciones" routerLinkActive="activo">
    <mat-icon>assignment_return</mat-icon>
    Devoluciones
  </a>
</nav>

<main class="contenido">
  <router-outlet />
</main>
