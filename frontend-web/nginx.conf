# Servidor estatico para la SPA de Angular.
# nginx sustituye ${PORT} al arrancar (plantilla en /etc/nginx/templates).

server {
    listen ${PORT};
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Una SPA con enrutado del lado del cliente: cualquier ruta que no sea un
    # archivo real tiene que devolver index.html. Sin esto, recargar la pagina
    # en /admin/productos da 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los assets con hash en el nombre no cambian nunca: cache larga.
    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html nunca se cachea: es quien apunta a los assets nuevos.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
