; Configuracion de Alembic - FashionStore
;
; La URL de la base NO se escribe aqui: se lee de DATABASE_URL en
; alembic/env.py, para que el mismo archivo sirva en local y en Railway.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

; Nombre de archivo de migracion: fecha + descripcion, para que el orden
; cronologico sea visible en el listado de la carpeta.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
